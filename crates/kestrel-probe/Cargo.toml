[package]
name = "kestrel-probe"
description = "Stage-1 hardware probe: discover, pair and stream a PS5 from the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
kestrel-core = { path = "../kestrel-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
cpal = "0.18"
sdl3 = { version = "0.22", features = ["build-from-source-static"] }
ctrlc = "3"
parking_lot = "0.13"
