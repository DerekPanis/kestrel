name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast feedback: unit + loopback tests against the real libchiaki on Linux.
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config protobuf-compiler python3-protobuf \
            libssl-dev libopus-dev libjson-c-dev libevent-dev libminiupnpc-dev \
            libasound2-dev libudev-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libxfixes-dev libxtst-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Build kbridge
        run: |
          cmake -S native -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -Wno-dev
          cmake --build build-native --target kbridge
      - name: Test
        env:
          KBRIDGE_LIB_DIR: ${{ github.workspace }}/build-native
        run: cargo test --workspace --locked
      - name: Clippy
        env:
          KBRIDGE_LIB_DIR: ${{ github.workspace }}/build-native
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::correctness

  # The real target: Windows x64 build of kbridge.dll + kestrel-probe.exe.
  windows:
    runs-on: windows-latest
    env:
      CC: clang-cl.exe
      CXX: clang-cl.exe
      triplet: x64-windows
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set vcpkg paths
        run: |
          echo "VCPKG_INSTALLED_DIR=${{ github.workspace }}\build-native\vcpkg_installed" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up Ninja
        run: choco install ninja -y
      - name: Set up Clang
        uses: egor-tensin/setup-clang@v2
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages for nanopb
        run: python -m pip install --upgrade protobuf grpcio-tools
      - name: vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 42bb0d9e8d4cf33485afb9ee2229150f79f61a1f
          vcpkgJsonGlob: native/vcpkg.json
          runVcpkgInstall: true
      - name: Patch gf-complete for MSVC (same patch chiaki-ng uses)
        working-directory: vendor/chiaki-ng
        run: git apply --ignore-whitespace --verbose --directory=third-party/gf-complete/ scripts/windows-vc/gf-complete.patch
      - name: Build kbridge.dll
        run: |
          cmake -S native -B build-native -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE:STRING="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="${{ github.workspace }}\native" `
            -DVCPKG_TARGET_TRIPLET=${{ env.triplet }} `
            -DPYTHON_EXECUTABLE="$((Get-Command python).Source)" `
            -Wno-dev
          cmake --build build-native --target kbridge
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests (unit + loopback against real libchiaki)
        env:
          KBRIDGE_LIB_DIR: ${{ github.workspace }}\build-native
        run: |
          $env:PATH = "${{ github.workspace }}\build-native;${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin;$env:PATH"
          cargo test --workspace --locked
      - name: Build kestrel-probe
        env:
          KBRIDGE_LIB_DIR: ${{ github.workspace }}\build-native
        run: cargo build --release -p kestrel-probe --locked
      - name: Package
        run: |
          $out = "kestrel-probe-win64"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item target\release\kestrel-probe.exe $out
          Copy-Item build-native\kbridge.dll $out
          Get-ChildItem "${env:VCPKG_INSTALLED_DIR}\${{ env.triplet }}\bin\*.dll" | Copy-Item -Destination $out
          Copy-Item docs\STAGE1-TESTING.md $out\README.md
          Copy-Item LICENSE $out
          # Smoke test: the exe must start and find every DLL it needs.
          & "$out\kestrel-probe.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "kestrel-probe failed to start" }
          & "$out\kestrel-probe.exe" audio-devices
      - uses: actions/upload-artifact@v4
        with:
          name: kestrel-probe-win64
          path: kestrel-probe-win64
